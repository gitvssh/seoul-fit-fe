apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seoul-fit-dev
resources:
  - ../../base
  # The backend overlay owns the shared Namespace object, avoiding two Argo CD
  # Applications tracking the same cluster-scoped resource.
  # host는 httproute.yaml 참조 (TLS는 Gateway 종단)
  - httproute.yaml
images:
  - name: registry.damecasol.com/seoul-fit/frontend
    newName: registry.damecasol.com/seoul-fit/frontend
    digest: sha256:8960f5aca1b7d348c15aa04323b342b3335d00cd31ae76868a8bdcaa7523aa19
patches:
  - target:
      kind: Deployment
      name: seoul-fit-fe
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/metadata/annotations/observability.damecasol.com~1service-version
        value: sha256:8960f5aca1b7d348c15aa04323b342b3335d00cd31ae76868a8bdcaa7523aa19
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1environment
        value: dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BACKEND_INTERNAL_URL
          value: http://seoul-fit-backend.seoul-fit-dev.svc.cluster.local:8080
  - target:
      kind: VaultAuth
      name: seoul-fit-fe
    patch: |-
      - op: replace
        path: /spec/kubernetes/role
        value: seoul-fit-dev
  - target:
      kind: VaultStaticSecret
      name: seoul-fit-fe-env
    patch: |-
      - op: replace
        path: /spec/path
        value: projects/seoul-fit/fe-dev
