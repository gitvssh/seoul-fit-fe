# seoul-fit FE HTTPRoute (dev) — seoulfit.dev.damecasol.com catch-all.
# 백엔드 경로(/api·/login/oauth2·/oauth2 등)는 backend 레포의 HTTPRoute 가
# 최장 prefix 우선으로 가져간다 (Gateway API 스펙 보장, atlas 전례).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seoul-fit-fe
  labels:
    app.kubernetes.io/part-of: seoul-fit
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-gateway
      namespace: kube-system
      sectionName: websecure-dev
  hostnames:
    - seoulfit.dev.damecasol.com
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: seoul-fit-fe
          port: 3000
