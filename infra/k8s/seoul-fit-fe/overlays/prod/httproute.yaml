# seoul-fit FE HTTPRoute (prod) — seoulfit.damecasol.com catch-all.
# 백엔드 경로는 backend 레포 HTTPRoute 가 최장 prefix 우선으로 가져간다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seoul-fit-fe
  labels:
    app.kubernetes.io/part-of: seoul-fit
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-gateway
      namespace: kube-system
      sectionName: websecure-seoulfit-public
  hostnames:
    - seoulfit.damecasol.com
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: seoul-fit-fe
          port: 3000
