apiVersion: apps/v1
kind: Deployment
metadata:
  name: seoul-fit-fe
  labels:
    app.kubernetes.io/name: seoul-fit-fe
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: seoul-fit
spec:
  # instrumentation.ts owns an in-memory scheduler. Keep one replica until its
  # cache/scheduler coordination is externalized.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seoul-fit-fe
  template:
    metadata:
      annotations:
        observability.damecasol.com/log-schema: http_access_json_v1
        observability.damecasol.com/service-version: PLACEHOLDER
      labels:
        app.kubernetes.io/name: seoul-fit-fe
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: seoul-fit
        app.kubernetes.io/environment: PLACEHOLDER
    spec:
      imagePullSecrets:
        - name: seoul-fit-fe-harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: registry.damecasol.com/seoul-fit/frontend@sha256:PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: seoul-fit-fe-env
          env:
            - name: OTEL_SERVICE_NAME
              value: seoul-fit-frontend
            - name: OTEL_SERVICE_NAMESPACE
              value: seoul-fit
            - name: OTEL_SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['observability.damecasol.com/service-version']
            - name: OTEL_SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DEPLOYMENT_ENVIRONMENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/environment']
            - name: K8S_WORKLOAD_NAME
              value: seoul-fit-fe
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
