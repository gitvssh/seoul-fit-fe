# BACKEND_INTERNAL_URL is non-secret environment topology and is supplied by
# each overlay. This Secret contains only the Seoul Open Data API credential.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: seoul-fit-fe-env
  labels:
    app.kubernetes.io/name: seoul-fit-fe
    app.kubernetes.io/part-of: seoul-fit
spec:
  vaultAuthRef: seoul-fit-fe
  mount: kv
  type: kv-v2
  path: projects/seoul-fit/fe-PLACEHOLDER
  refreshAfter: 1h
  destination:
    name: seoul-fit-fe-env
    create: true
    transformation:
      excludeRaw: true
      templates:
        SEOUL_API_KEY:
          text: |-
            {{- get .Secrets "SEOUL_API_KEY" -}}
  rolloutRestartTargets:
    - kind: Deployment
      name: seoul-fit-fe
