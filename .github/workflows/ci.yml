name: CI

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/scripts/wait_for_sonar_quality_gate.py"
      - "Dockerfile"
      - "app/**"
      - "pages/**"
      - "config/**"
      - "lib/**"
      - "public/**"
      - "src/**"
      - "styles/**"
      - "instrumentation.ts"
      - "docker-entrypoint.sh"
      - "infra/runtime/**"
      - "infra/scripts/validate_observability_contract.py"
      - "next.config.*"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "tsconfig.json"
      - "jest.config.js"
      - "sonar-project.properties"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/scripts/wait_for_sonar_quality_gate.py"
      - "Dockerfile"
      - "app/**"
      - "pages/**"
      - "config/**"
      - "lib/**"
      - "public/**"
      - "src/**"
      - "styles/**"
      - "instrumentation.ts"
      - "docker-entrypoint.sh"
      - "infra/runtime/**"
      - "infra/scripts/validate_observability_contract.py"
      - "next.config.*"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "tsconfig.json"
      - "jest.config.js"
      - "sonar-project.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seoul-fit-frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  quality:
    name: Type check and test
    runs-on: homelab-seoul-fit-fe
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:coverage -- --runInBand
      - run: npm run test:runtime
      - run: npm run build

  sonar:
    name: SonarQube quality gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [quality]
    runs-on: homelab-seoul-fit-fe
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: npm ci
      - name: Rebuild scanner coverage input
        run: npm run test:coverage -- --runInBand
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          skipSignatureVerification: true
        env:
          SONAR_SCANNER_JAVA_OPTS: "-Xmx3g"
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - name: Wait for and report the quality gate
        run: python3 .github/scripts/wait_for_sonar_quality_gate.py --timeout 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
