name: CI

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ci.yml"
      - "app/**"
      - "config/**"
      - "lib/**"
      - "src/**"
      - "styles/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.js"
      - "infra/argocd/**"
      - "infra/k8s/**"
      - "infra/scripts/validate_argocd_registration.py"
      - "sonar-project.properties"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/ci.yml"
      - "app/**"
      - "config/**"
      - "lib/**"
      - "src/**"
      - "styles/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.js"
      - "infra/argocd/**"
      - "infra/k8s/**"
      - "infra/scripts/validate_argocd_registration.py"
      - "sonar-project.properties"

permissions:
  contents: read

concurrency:
  group: seoul-fit-frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  quality:
    name: Type check and test
    runs-on: homelab-seoul-fit-fe
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:coverage -- --runInBand
      - run: npm run build

  manifests:
    name: GitOps contract and overlays
    runs-on: homelab-seoul-fit-fe
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - run: python3 infra/scripts/validate_argocd_registration.py
      - run: kubectl kustomize infra/k8s/seoul-fit-fe/overlays/dev >/dev/null
      - run: kubectl kustomize infra/k8s/seoul-fit-fe/overlays/prod >/dev/null

  sonar:
    name: SonarQube quality gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [quality, manifests]
    runs-on: homelab-seoul-fit-fe
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Rebuild scanner coverage input
        run: npm run test:coverage -- --runInBand
      - name: Scan and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          skipSignatureVerification: true
        env:
          SONAR_SCANNER_JAVA_OPTS: "-Xmx3g"
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
