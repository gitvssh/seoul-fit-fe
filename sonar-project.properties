sonar.projectKey=seoul-fit-frontend
sonar.projectName=Seoul Fit Frontend
# PREVIOUS_VERSION new-code baseline. Keep aligned with package.json and bump
# only for a verified release, never for every CI build.
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8
sonar.sources=app,config,lib,src
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json

sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/*.d.ts,**/*.config.*
sonar.coverage.exclusions=**/__tests__/**,**/*.test.*,**/*.spec.*
