sonar.projectKey=seoul-fit-frontend
sonar.projectName=Seoul Fit Frontend
# PREVIOUS_VERSION new-code baseline. Keep aligned with package.json and bump
# only for a verified release, never for every CI build.
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8
sonar.sources=app,config,lib,src
# Test modules remain analyzed as tests, rather than application source.
sonar.tests=app,config,lib,src
sonar.test.inclusions=**/__tests__/**,**/*.test.*,**/*.spec.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json

sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/*.d.ts,**/*.config.*
sonar.coverage.exclusions=**/__tests__/**,**/*.test.*,**/*.spec.*
# Repeated translation keys and bilingual copy are data. The CI scope guard
# rejects executable logic in these exact paths; application duplication stays gated.
sonar.cpd.exclusions=src/shared/i18n/messages/*.ts,app/about/_components/about-content.ts
